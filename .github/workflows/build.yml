name: build

# Builds and tests the macOS client on a GitHub-hosted runner and attests the archive's provenance.
#
# Every push to main and every pull request: tests, a universal Netlane.app, the pkg and zip as artifacts.
# A pushed tag vX.Y.Z additionally creates a DRAFT release with them, their SHA-256 and install.sh.
# Installed clients take only a published release whose zip carries the owner's signature (.sig, made off
# GitHub with the release key), so the owner signs and then publishes the draft (UpdateFeed.swift).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag vX.Y.Z to draft from this commit (the tag is created when the draft is published)
        required: false
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  # The engine with application routing: TrustTunnel Client built from source with engine/upstream/*.patch.
  # Cached by the patches and the build script, so it is rebuilt only when they change.
  engine:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Cached engine
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: engine/dist
          key: engine-${{ hashFiles('engine/build-engine.sh', 'engine/upstream/*.patch', 'Sources/NetlaneCore/Session.swift') }}

      - name: Conan cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('engine/upstream/*.patch') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Build and test the engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          command -v rustup >/dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"; }
          engine/build-engine.sh

      - name: Upload engine
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: engine
          path: engine/dist
          if-no-files-found: error

  build:
    needs: engine
    runs-on: macos-15
    permissions:
      contents: write      # the draft release
      id-token: write      # artifact attestations
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tag matches the client version
        if: env.RELEASE_TAG != ''
        run: |
          # A tag that differs from AppInfo.version would offer the same update again after every install.
          version=$(sed -n 's/.*public static let version = "\(.*\)"/\1/p' Sources/NetlaneCore/Support.swift | head -1)
          if [ "v$version" != "$RELEASE_TAG" ]; then echo "Tag $RELEASE_TAG does not match AppInfo.version $version" >&2; exit 1; fi

      - name: Download engine
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: engine
          path: engine/dist

      - name: Test and build
        env:
          ENGINE_BINARY: engine/dist/trusttunnel_client
        run: scripts/build-app.sh

      - name: Screenshots for the README
        if: env.RELEASE_TAG == ''
        continue-on-error: true
        run: dist/Netlane.app/Contents/MacOS/Netlane --render dist/screenshots

      - name: Upload screenshots
        if: env.RELEASE_TAG == ''
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshots
          path: dist/screenshots

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/Netlane-macos.zip
            dist/Netlane-macos.pkg

      - name: Upload archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Netlane-macos
          path: |
            dist/Netlane-macos.zip
            dist/Netlane-macos.zip.sha256
            dist/Netlane-macos.pkg
            dist/Netlane-macos.pkg.sha256
          if-no-files-found: error

      - name: Draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"; version="${tag#v}"
          # Release notes: the CHANGELOG section of this version.
          awk -v v="$version" '/^## /{on = index($0, "## " v) == 1; next} on' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Netlane $version" > release-notes.md
          printf '\n\nПодпись владельца: `openssl dgst -sha256 -verify netlane-release.pub -signature Netlane-macos.zip.sig Netlane-macos.zip`. Происхождение сборки: `gh attestation verify Netlane-macos.zip --repo %s`\n' "$GITHUB_REPOSITORY" >> release-notes.md
          assets=(dist/Netlane-macos.pkg dist/Netlane-macos.pkg.sha256 dist/Netlane-macos.zip dist/Netlane-macos.zip.sha256 install.sh)
          # A published release is immutable and already signed: never replace its archive.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "$tag is already published" >&2; exit 1; }
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "Netlane $version" --notes-file release-notes.md
          else
            gh release create "$tag" "${assets[@]}" --draft --target "$GITHUB_SHA" --title "Netlane $version" --notes-file release-notes.md
          fi
          echo "::notice::Draft $tag is ready: sign Netlane-macos.zip and Netlane-macos.pkg, then publish"
